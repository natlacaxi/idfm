name: Site trains IDF
# Construit les données, puis publie le site sur GitHub Pages.
# Réglage à faire une fois : Settings > Pages > Source = « GitHub Actions ».
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/20 * * * *"   # incidents toutes les 20 min ; trains reconstruits à 0h, 6h, 12h, 18h (heure de Paris)
  workflow_dispatch:
    inputs:
      full:
        description: "Tout reconstruire maintenant"
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scipy
      - id: s
        run: |
          echo "slot=$(TZ=Europe/Paris date +%F)-$(( 10#$(TZ=Europe/Paris date +%H) / 6 ))" >> "$GITHUB_OUTPUT"
          echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4          # données du réseau : gardées entre deux exécutions
        with:
          path: data
          key: data-${{ steps.s.outputs.slot }}
          restore-keys: data-
      - uses: actions/cache@v4          # voies OpenStreetMap : téléchargées une fois par mois
        with:
          path: cache
          key: osm-rail-${{ steps.s.outputs.month }}
      - name: Génération des données
        continue-on-error: true         # en cas d'échec, le site est quand même publié
        env:
          PRIM_API_KEY: ${{ secrets.PRIM_API_KEY }}
        run: python build_data.py --auto ${{ inputs.full && '--force' || '' }}
      - name: Préparer le site
        run: |
          mkdir _site
          cp -r index.html config.js manifest.webmanifest sw.js icons data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: dep
        uses: actions/deploy-pages@v4
