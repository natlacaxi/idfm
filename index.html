<style>
:root{--bg:#f5f6f4;--ink:#1b2430;--mut:#667085;--line:#d7dbd6;--board:#14202e;--amber:#ffc83d}
@media (prefers-color-scheme:dark){:root{--bg:#18202a;--ink:#e8ecef;--mut:#9aa6b2;--line:#2c3744}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:Barlow,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex}
#side{width:340px;max-width:42vw;display:flex;flex-direction:column;border-right:1px solid var(--line);z-index:1000;background:var(--bg)}
#map{flex:1}
header{padding:14px 16px 10px}
h1{font:700 26px/1 'Barlow Condensed',sans-serif;margin:0 0 10px}
#q{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit;font:inherit}
#res{margin-top:6px;max-height:160px;overflow:auto}
#res button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:6px 4px;cursor:pointer;border-bottom:1px solid var(--line)}
#res button:hover,#res button:focus-visible{background:rgba(127,127,127,.12);outline:none}
#board{margin:0 12px 12px;background:var(--board);color:#fff;border-radius:6px;padding:12px 14px;flex:1;overflow:auto;min-height:120px}
#board h2{font:700 22px/1.1 'Barlow Condensed',sans-serif;margin:0 0 2px;color:var(--amber)}
#sub{font-size:12px;color:#9fb0c2;margin-bottom:8px}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid #2a3b4e}
.ln{font:700 15px 'Barlow Condensed',sans-serif;background:#2d4a6b;border-radius:3px;text-align:center;padding:1px 0}
.dest{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t{font:700 20px 'Barlow Condensed',sans-serif;color:var(--amber)}
.t.x{color:#ff7a6b;text-decoration:line-through}
#msg{font-size:13px;color:#ffb4a8;margin-top:8px;line-height:1.4}
#leg{padding:0 16px 12px;font-size:12px;color:var(--mut);display:flex;flex-wrap:wrap;gap:4px 12px}
#leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
@media (max-width:700px){body{flex-direction:column-reverse}#side{width:100%;max-width:none;height:48vh;border-right:0;border-top:1px solid var(--line)}#map{height:52vh;flex:none}}
#ctl{margin-top:8px}#ctl select{width:100%;padding:7px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit;font:inherit}
#map.sch{background:#0f1720}
#inc{padding:0 16px 8px;font-size:12px;max-height:110px;overflow:auto}#inc b{color:#e5483b}
#banner{position:fixed;z-index:1100;left:50%;top:10px;transform:translateX(-50%);background:#14202e;color:#fff;padding:9px 13px;border-radius:6px;font-size:13px;display:none;max-width:80%}
#inst{width:100%;margin-top:8px;padding:8px;border:0;border-radius:6px;background:#63b3e4;color:#0b2230;font:500 14px Barlow,sans-serif;cursor:pointer}
</style>
</head>

<aside id="side">
  <header>

    <input id="q" type="search" placeholder="Chercher une gare" autocomplete="off" aria-label="Chercher une gare">
    <div id="ctl"><select id="sel" aria-label="Fond de carte"><option value="osm">Fond OpenStreetMap</option><option value="sat">Satellite (IGN)</option><option value="carto">Fond CARTO clair</option><option value="sch">Schéma horizontal / vertical (sans fond)</option><option value="s45">Schéma 45° (sans fond)</option></select></div>
    <label id="gl" hidden style="display:block;margin-top:8px;font-size:12px;color:var(--mut)">Taille de la grille <input id="grid" type="range" min="3" max="12" value="5" style="width:100%"></label>
    <button id="inst" hidden>Installer l’appli</button>
    <div id="res"></div>

  <div id="board">
    <h2 id="bt">Choisissez une gare</h2>

    <div id="rows"></div><div id="msg"></div>
  </div>
  <div id="cnt" style="padding:0 16px 4px;font-size:12px;color:var(--mut)"></div><div id="inc"></div><div id="leg"></div>
</aside>

}

  if(!navigator.onLine)return'Hors connexion : les passages reviendront avec le réseau.';
  if(st===401||st===403)return'Clé refusée par PRIM (HTTP '+st+'). Vérifiez votre jeton et l’abonnement à l’API « Prochains passages ». <a href="#" id="ck" style="color:#ffc83d">Changer la clé</a>';
  if(st===429)return'Trop de requêtes vers PRIM : patientez une minute, la page réessaiera.';
  if(st>=500)return'Le service PRIM est indisponible (HTTP '+st+'). Nouvel essai automatique.';
  if(e&&e.name==='AbortError')return'PRIM met trop de temps à répondre. Nouvel essai automatique.';
  return'Appel à PRIM impossible ('+((e&&e.message)||st)+'). Si c’est « Failed to fetch », PRIM bloque le navigateur (CORS) : il faut un petit proxy côté serveur.';
}
async function load(){
  const s=cur;if(!s)return;
  const rows=document.getElementById('rows'),msg=document.getElementById('msg');msg.textContent='';
  let st=0;
  try{
    const r=await getJSON(PRIM_URL+encodeURIComponent('STIF:StopArea:SP:'+s.z+':'),{headers:PRIM_KEY?{apikey:PRIM_KEY}:{}});
    st=r.status;if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();if(s!==cur)return;
    const v=(((j.Siri||{}).ServiceDelivery||{}).StopMonitoringDelivery||[{}])[0].MonitoredStopVisit||[];
    const now=Date.now();
    const list=v.filter(x=>x&&x.MonitoredVehicleJourney).map(x=>{
      const mv=x.MonitoredVehicleJourney,c=mv.MonitoredCall||{};
      const iso=c.ExpectedDepartureTime||c.ExpectedArrivalTime||c.AimedDepartureTime;
      const code=((mv.LineRef||{}).value||'').match(/C\d+/);
      const dn=(mv.DestinationName&&mv.DestinationName[0]&&mv.DestinationName[0].value)||(c.DestinationDisplay&&c.DestinationDisplay[0]&&c.DestinationDisplay[0].value)||'';
      return{t:iso?new Date(iso).getTime():NaN,ln:code?(LINES[code[0]]||code[0]):'?',dn,x:c.DepartureStatus==='cancelled'};
    }).filter(x=>!isNaN(x.t)&&x.t>now-60000).sort((a,b)=>a.t-b.t).slice(0,12);
    rows.innerHTML=list.map(x=>{const mn=Math.max(0,Math.round((x.t-now)/60000));
      return`<div class="row"><span class="ln">${esc(x.ln)}</span><span class="dest">${esc(x.dn)}</span><span class="t${x.x?' x':''}">${x.x?'supprimé':(mn<1?'à quai':mn+' min')}</span></div>`}).join('');
    if(!list.length)msg.textContent='Aucun passage annoncé pour le moment.';
  }catch(e){
    if(s!==cur)return;rows.innerHTML='';msg.innerHTML=explain(e,st);
    const ck=document.getElementById('ck');
    if(ck)ck.onclick=ev=>{ev.preventDefault();const k=prompt('Collez votre jeton PRIM :');if(k){PRIM_KEY=k.trim();try{localStorage.setItem('prim_key',PRIM_KEY)}catch(_){}load()}};
  }
}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const q=document.getElementById('q'),res=document.getElementById('res');
q.addEventListener('input',()=>{
  const v=norm(q.value.trim());res.innerHTML='';if(v.length<2)return;
  STATIONS.filter(s=>norm(s.n).includes(v)).slice(0,8).forEach(s=>{
    const b=document.createElement('button');b.textContent=s.n+' — '+s.l.join(', ');
    b.onclick=()=>{select(s,true);res.innerHTML='';q.value=''};res.appendChild(b);
  });
});
/* ---- fond de carte, tracés, trains, incidents ---- */
const mapEl=document.getElementById('map'),banner=document.getElementById('banner'),sel=document.getElementById('sel'),cnt=document.getElementById('cnt'),incEl=document.getElementById('inc');
const warn=h=>{banner.innerHTML=h;banner.style.display='block'};
const TILES={
 osm:{u:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',o:{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'},err:'OpenStreetMap refuse les tuiles : la page est sans doute ouverte comme fichier local. Hébergez-la (GitHub Pages, <code>python -m http.server</code>).',alt:'carto'},
 sat:{u:'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=image/jpeg',o:{maxZoom:19,attribution:'© <a href="https://geoservices.ign.fr">IGN</a> – orthophotographies'},err:'Le fond satellite IGN ne répond pas.',alt:'osm'},
 carto:{u:'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',o:{subdomains:'abcd',maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · © <a href="https://carto.com/attributions">CARTO</a>'},err:'Le fond CARTO ne répond pas.',alt:'osm'}
};
let base=null,tileErr=0,NET=null,items=[],bad=new Set(),mode='osm';
try{mode=localStorage.getItem('fond')||'osm'}catch(_){}
if(!(mode in TILES)&&mode!=='sch'&&mode!=='s45')mode='osm';
const polys=[],trainMk=new Map(),shapeCum={},lineLayers=L.layerGroup().addTo(map),trainLayer=L.layerGroup().addTo(map);
function setBase(k){
  if(base){base.remove();base=null}
  const SCHM=k==='sch'||k==='s45';mapEl.classList.toggle('sch',SCHM);gl.hidden=!SCHM;document.body.dataset.mode=k;banner.style.display='none';tileErr=0;
  const T=TILES[k];
  if(T){base=L.tileLayer(T.u,T.o).addTo(map);
    base.on('tileerror',()=>{if(++tileErr===6){
      warn(T.err+' <a href="#" id="tc" style="color:#ffc83d">Essayer un autre fond</a>');
      document.getElementById('tc').onclick=e=>{e.preventDefault();sel.value=T.alt;sel.onchange()}}});}
  restyle();redraw();
}
function restyle(){
  const s=document.body.dataset.mode,sc=s==='sch'||s==='s45';const bold=sc||s==='sat';
  polys.forEach(p=>p.l.setStyle({weight:bold?4:3,opacity:bold?1:.85}));
  STATIONS.forEach(x=>markers[x.z].setStyle(sc?{radius:3.5,color:'#0f1720',fillColor:'#fff'}:{radius:5,color:'#fff',fillColor:colOf(x.m)}));
}
sel.value=mode;
sel.onchange=()=>{try{localStorage.setItem('fond',sel.value)}catch(_){}setBase(sel.value)};
/* ---- schéma : traits horizontaux / verticaux (ou 45°) sur une grille ---- */
const KK=Math.cos(48.85*Math.PI/180);
let SG=5,endpoints=null;const schCache={};
const isSch=()=>{const m=document.body.dataset.mode;return m==='sch'||m==='s45'};
function snap(p){const g=SG*0.001,h=g/KK;return[Math.round(p[0]/g)*g,Math.round(p[1]/h)*h]}
function schPath(A,B,m){
  const dy=B[0]-A[0],dx=(B[1]-A[1])*KK;
  if(Math.abs(dy)<1e-9||Math.abs(dx)<1e-9)return[A,B];
  if(m==='sch')return Math.abs(dx)>=Math.abs(dy)?[A,[A[0],B[1]],B]:[A,[B[0],A[1]],B];
  const dg=Math.min(Math.abs(dx),Math.abs(dy));
  return[A,[A[0]+Math.sign(dy)*dg,A[1]+Math.sign(dx)*dg/KK],B];
}
function geo(id){
  if(!isSch())return NET.segs[id];
  const m=document.body.dataset.mode,k=m+SG+':'+id;let r=schCache[k];if(r)return r;
  const p=NET.segs[id];return schCache[k]=schPath(snap(p[0]),snap(p[p.length-1]),m);
}
function cumOf(id){
  const key=isSch()?document.body.dataset.mode+SG+':'+id:id;let c=shapeCum[key];if(c)return c;
  const p=geo(id);c=[0];
  for(let i=1;i<p.length;i++)c.push(c[i-1]+Math.hypot(p[i][0]-p[i-1][0],(p[i][1]-p[i-1][1])*KK));
  return shapeCum[key]=c;
}
function along(id,u){
  const p=geo(id),c=cumOf(id),target=u*c[c.length-1];
  let lo=0,hi=c.length-1;while(hi-lo>1){const m=(lo+hi)>>1;c[m]<=target?lo=m:hi=m}
  const f=(target-c[lo])/((c[hi]-c[lo])||1);
  return[p[lo][0]+(p[hi][0]-p[lo][0])*f,p[lo][1]+(p[hi][1]-p[lo][1])*f];
}
function nearEnd(s){
  if(!endpoints){endpoints={};NET.segs.forEach(g=>[g[0],g[g.length-1]].forEach(p=>{const k=Math.round(p[0]/.003)+','+Math.round(p[1]/.003);(endpoints[k]=endpoints[k]||[]).push(p)}))}
  const a=Math.round(s.la/.003),b=Math.round(s.lo/.003);let best=null,bd=0.0025*0.0025;
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++)for(const p of endpoints[(a+i)+','+(b+j)]||[]){const d=(p[0]-s.la)**2+((p[1]-s.lo)*KK)**2;if(d<bd){bd=d;best=p}}
  return best;
}
function redraw(){
  if(!NET)return;
  polys.forEach((p,i)=>p.l.setLatLngs(NET.routes[i].g.map(i=>geo(i))));
  const sc=isSch();
  STATIONS.forEach(s=>{const e=sc?nearEnd(s):null;markers[s.z].setLatLng(sc?snap(e||[s.la,s.lo]):[s.la,s.lo])});
  if(ring&&cur)ring.setLatLng(markers[cur.z].getLatLng());
  trainLayer.clearLayers();trainMk.clear();tick();
}
const grid=document.getElementById('grid'),gl=document.getElementById('gl');
grid.oninput=()=>{SG=+grid.value;redraw()};
function parisSecs(){
  const f=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Paris',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  const g=t=>+f.find(x=>x.type===t).value;return g('hour')*3600+g('minute')*60+g('second');
}
function tick(){
  if(!NET)return;
  try{
    const now=parisSecs(),live=new Set();
    NET.trips.forEach((tr,i)=>{
      const ts=tr[2];if(now<ts[0]||now>ts[ts.length-1])return;
      let lo=0,hi=ts.length-1;while(hi-lo>1){const m=(lo+hi)>>1;ts[m]<=now?lo=m:hi=m}
      const seg=NET.patterns[tr[1]][lo];if(seg===undefined)return;
      const ll=along(seg,ts[hi]>ts[lo]?(now-ts[lo])/(ts[hi]-ts[lo]):0);live.add(i);
      let m=trainMk.get(i);
      if(m)m.setLatLng(ll);
      else{const r=NET.routes[tr[0]];m=L.circleMarker(ll,{radius:5,color:'#fff',weight:1.5,fillColor:r.c,fillOpacity:1}).bindTooltip('Ligne '+r.n).addTo(trainLayer);trainMk.set(i,m)}
    });
    for(const[i,m]of trainMk)if(!live.has(i)){m.remove();trainMk.delete(i)}
    const old=NET.date!==new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Paris'}).format(new Date());
    cnt.textContent=live.size+' trains en circulation, positions calculées d’après les horaires théoriques'+(old?' (données du '+NET.date+')':'');
  }catch(e){console.warn(e)}
}
function applyInc(list){
  items=list;bad=new Set(list.map(i=>i.line));
  incEl.innerHTML=list.length?'<b>'+list.length+' perturbation(s)</b><br>'+list.slice(0,8).map(i=>esc((LINES[i.line]||i.line)+' : '+i.title)).join('<br>'):'';
  polys.forEach(p=>p.l.setStyle({dashArray:bad.has(p.id)?'6 6':null}));
}
async function loadInc(){
  try{const r=await getJSON('data/incidents.json',{cache:'no-store'},1,8000);if(r.ok)applyInc((await r.json()).items||[])}catch(_){}
}
function setNet(n){
  NET=n;endpoints=null;Object.keys(shapeCum).forEach(k=>delete shapeCum[k]);Object.keys(schCache).forEach(k=>delete schCache[k]);
  n.trips.forEach(tr=>{if(typeof tr[2]==='number'){const ts=[tr[2]];tr[3].forEach(d=>ts.push(ts[ts.length-1]+d));tr[2]=ts}});
  lineLayers.clearLayers();polys.length=0;trainLayer.clearLayers();trainMk.clear();
  n.routes.forEach(r=>polys.push({id:r.id,l:L.polyline(r.g.map(i=>geo(i)),{color:r.c,weight:3,opacity:.85,interactive:false}).addTo(lineLayers)}));
  Object.values(markers).forEach(m=>m.bringToFront());
  restyle();applyInc(items);redraw();
}
async function refreshNet(first){
  try{
    const r=await getJSON('data/network.json',{cache:'no-store'},2,90000);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const n=await r.json();if(first||!NET||n.slot!==NET.slot)setNet(n);
  }catch(e){if(first)cnt.textContent='Pas de données GTFS (data/network.json) : lancez build_data.py (ou le workflow GitHub) et ouvrez la page via http.'}
}
addEventListener('offline',()=>warn('Hors connexion : la carte reste visible, les passages reviendront avec le réseau.'));
addEventListener('online',()=>{banner.style.display='none';if(cur)load()});
let dp=null;const inst=document.getElementById('inst');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;inst.hidden=false});
inst.onclick=async()=>{if(!dp)return;dp.prompt();try{await dp.userChoice}catch(_){}dp=null;inst.hidden=true};
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
setBase(mode);
loadInc().then(()=>refreshNet(true)).then(()=>setInterval(tick,2000));
setInterval(loadInc,300000);setInterval(()=>refreshNet(false),1800000);
</script>
